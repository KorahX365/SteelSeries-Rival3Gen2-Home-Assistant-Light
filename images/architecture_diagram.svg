<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="haGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A9F4"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="rgbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="50%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="340" rx="16" fill="#181B1F"/>

  <!-- Bloque 1: Home Assistant -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="200" height="200" rx="14" fill="#22262C" stroke="#03A9F4" stroke-width="2"/>
    <rect x="40" y="70" width="200" height="40" rx="14" fill="url(#haGrad)"/>
    <text x="140" y="96" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Home Assistant</text>
    <text x="140" y="145" fill="#E0E0E0" font-size="13" text-anchor="middle">Template Light</text>
    <text x="140" y="168" fill="#9E9E9E" font-size="11" text-anchor="middle">(Rueda RGB y Brillo)</text>
    <rect x="60" y="195" width="160" height="32" rx="6" fill="#121417"/>
    <text x="140" y="216" fill="#03A9F4" font-size="12" font-family="monospace" text-anchor="middle">POST /set_color</text>
    <text x="140" y="248" fill="#757575" font-size="10" text-anchor="middle">JSON: {"r":255,"g":0,"b":128}</text>
  </g>

  <!-- Flecha 1 -->
  <path d="M 240 170 L 290 170" stroke="#03A9F4" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="290,165 300,170 290,175" fill="#03A9F4"/>
  <text x="270" y="155" fill="#9E9E9E" font-size="10" text-anchor="middle">Tailscale / LAN</text>

  <!-- Bloque 2: Puente PowerShell -->
  <g filter="url(#shadow)">
    <rect x="300" y="70" width="200" height="200" rx="14" fill="#22262C" stroke="#4CAF50" stroke-width="2"/>
    <rect x="300" y="70" width="200" height="40" rx="14" fill="url(#bridgeGrad)"/>
    <text x="400" y="96" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Bridge PowerShell</text>
    <text x="400" y="138" fill="#E0E0E0" font-size="12" text-anchor="middle">Puerto HTTP :5055</text>
    <text x="400" y="160" fill="#81C784" font-size="11" text-anchor="middle">✓ Detecta Rival 3 USB</text>
    <text x="400" y="180" fill="#81C784" font-size="11" text-anchor="middle">✓ Heartbeat cada 1.5s</text>
    <text x="400" y="200" fill="#81C784" font-size="11" text-anchor="middle">✓ Keep-Alive persistente</text>
    <rect x="320" y="222" width="160" height="26" rx="4" fill="#121417"/>
    <text x="400" y="239" fill="#AED581" font-size="10" font-family="monospace" text-anchor="middle">Background Runspace</text>
  </g>

  <!-- Flecha 2 -->
  <path d="M 500 170 L 550 170" stroke="#FF5722" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="550,165 560,170 550,175" fill="#FF5722"/>
  <text x="530" y="155" fill="#9E9E9E" font-size="10" text-anchor="middle">Localhost API</text>

  <!-- Bloque 3: SteelSeries GG & Mouse -->
  <g filter="url(#shadow)">
    <rect x="560" y="70" width="200" height="200" rx="14" fill="#22262C" stroke="#FF5722" stroke-width="2"/>
    <rect x="560" y="70" width="200" height="40" rx="14" fill="url(#ssGrad)"/>
    <text x="660" y="96" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">SteelSeries Engine</text>
    <text x="660" y="135" fill="#FFCCBC" font-size="12" text-anchor="middle">GameSense REST API</text>
    <text x="660" y="155" fill="#9E9E9E" font-size="11" text-anchor="middle">Event: SET_COLOR</text>
    <text x="660" y="172" fill="#9E9E9E" font-size="11" text-anchor="middle">Zonas: one, two, three</text>

    <!-- Simulación del Ratón -->
    <rect x="580" y="195" width="160" height="55" rx="10" fill="#121417" stroke="url(#rgbGrad)" stroke-width="2"/>
    <text x="660" y="218" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">SteelSeries Rival 3</text>
    <text x="660" y="236" fill="url(#rgbGrad)" font-size="11" font-weight="bold" text-anchor="middle">● Iluminación Base RGB ●</text>
  </g>

  <!-- Pie explicativo -->
  <text x="400" y="308" fill="#757575" font-size="12" text-anchor="middle">Arquitectura de control RGB sin drivers extra ni software adicional</text>
</svg>
